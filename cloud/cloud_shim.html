<style>
.cl-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);font-size:13px}
.cl-bar b{font-weight:700;letter-spacing:.02em}.cl-plan{font:700 10.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;padding:4px 8px;border-radius:99px;border:1px solid var(--line)}
.cl-plan.pro{background:var(--text);color:var(--panel);border-color:var(--text)}.cl-live{display:inline-flex;gap:6px;align-items:center;color:var(--text-2)}
.cl-live i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:clp 1.6s infinite}@keyframes clp{70%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){.cl-live i{animation:none}}
.cl-inst{display:flex;gap:6px;align-items:center;min-width:0;flex:1 1 360px}.cl-inst code{font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 7px;overflow-x:auto;white-space:nowrap;min-width:0;flex:1}
.cl-bar button,.cl-bar a.cl-btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 10px;font:inherit;cursor:pointer;color:var(--text);text-decoration:none}
.cl-bar .cl-up{background:var(--codex);color:#fff;border-color:var(--codex);font-weight:650}
.cl-empty{margin:18px max(16px,env(safe-area-inset-left,0px));padding:18px;border:1px dashed var(--line);border-radius:10px;font-size:14px;max-width:760px}
.cl-empty ol{margin:8px 0 0;padding-left:20px;line-height:1.7}
</style>
<script>
// AgentLens Cloud: plan bar, live reload when new transcript lines arrive, first-run help.
(function(){
  const C=window.AGENTLENS_PAYWALL||{};
  const Native=window.EventSource;
  // The cloud stream carries only "session.reload" (new lines rebuilt this session) and "session.new"; reload the view on them.
  let lastReload=0,pending=null;
  function reloadNow(){lastReload=Date.now();pending=null;try{if(typeof load==='function'&&typeof S!=='undefined')load(S.session||null)}catch(e){}}
  window.EventSource=function(url){const es=new Native(url),self=this;let user=null;
    es.onmessage=m=>{let d=null;try{d=JSON.parse(m.data)}catch(_){}
      if(d&&d.type==='session.reload'){if(pending)return;const wait=Math.max(0,1500-(Date.now()-lastReload));pending=setTimeout(reloadNow,wait);return}
      if(d&&d.type==='session.new')return;
      user&&user(m)};
    Object.defineProperty(self,'onmessage',{set(f){user=f},get(){return user}});
    Object.defineProperty(self,'onopen',{set(f){es.onopen=f},get(){return es.onopen}});
    Object.defineProperty(self,'onerror',{set(f){es.onerror=f},get(){return es.onerror}});
    self.close=()=>es.close();};
  function bar(){
    const el=document.createElement('div');el.className='cl-bar';
    const pro=C.plan==='pro';
    el.innerHTML=`<b>AgentLens</b><span class="cl-plan${pro?' pro':''}">${pro?'PRO':'FREE'}</span><span class="cl-live"><i></i>live</span>`+
      `<span class="cl-inst"><span class="sub">Stream a machine:</span><code id="clInst"></code><button id="clCopy" type="button">Copy</button></span>`+
      (pro?'':C.payments===false?'<span class="cl-plan">PRO COMING SOON</span>':`<button class="cl-up" type="button" data-upgrade="bar">Upgrade to Pro${C.price?' · '+C.price:''}</button>`)+
      `<a class="cl-btn" href="/logout">Sign out</a>`;
    document.body.insertBefore(el,document.body.firstChild);
    document.getElementById('clInst').textContent=C.install||'';
    document.getElementById('clCopy').onclick=async e=>{try{await navigator.clipboard.writeText(C.install);e.target.textContent='Copied'}catch(_){const r=document.createRange();r.selectNodeContents(document.getElementById('clInst'));const s=getSelection();s.removeAllRanges();s.addRange(r);e.target.textContent='Selected'}};
  }
  async function firstRun(){
    try{const r=await (await fetch('/api/me')).json();if(r.sessions)return;
      const box=document.createElement('div');box.className='cl-empty';
      box.innerHTML=`<b>Waiting for your first session.</b><ol><li>Paste the line above into a terminal, or ask Claude Code or Codex to run it.</li><li>Start working in Claude Code or Codex as usual.</li><li>Your session appears here within a few seconds and updates live.</li></ol><p class="sub" style="margin:8px 0 0">Secrets that look like keys or passwords are removed on your machine before anything is sent.</p>`;
      document.querySelector('.cl-bar').after(box);
      const t=setInterval(async()=>{try{const m=await (await fetch('/api/me')).json();if(m.sessions){clearInterval(t);location.reload()}}catch(_){}},3000);
    }catch(_){}
  }
  if(document.body)bar();else document.addEventListener('DOMContentLoaded',()=>{bar();firstRun()});
  if(document.body)firstRun();
})();
</script>
