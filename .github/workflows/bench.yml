name: bench
# Unit tests, data validation, and agentlens-bench against the committed baseline: fails on a missed target or a
# statistically significant regression (bench/SPEC.md §6).
on:
  push:
  pull_request:
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests
        run: python3 test_agentlens.py
      - name: Validate data, schemas and checksums
        run: python3 bench/validate.py
      - name: Score AgentLens (fail on target miss or regression)
        run: python3 bench/evaluate.py --baseline bench/baselines/agentlens-1.2.0.json --fail-on-regression --md bench-report.md
      - name: Publish report
        if: always()
        run: cat bench-report.md >> "$GITHUB_STEP_SUMMARY"
